name: Offline regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install --no-deps .
      - name: Repository consistency
        run: python scripts/check_project.py
      - name: Unit regressions
        run: python -m unittest discover -s tests -v
      - name: LifeModel contract
        run: python tests/test_lifemodel_contract.py --strict lm
      - name: Deterministic seed sweep
        run: python tests/test_bench_sweep.py --range 0 400
      - name: Installed entry points outside checkout
        working-directory: /tmp
        run: |
          python -c 'from lifemodel import LifeModel; assert isinstance(LifeModel().state(), dict)'
          hyra --help
          python -m hyra --help
